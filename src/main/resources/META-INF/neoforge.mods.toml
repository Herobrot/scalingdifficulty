modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/${mod_id}/icon.png"
credits="Globox"
authors="Herobrot"
description='''
Scale mob statistics based on time/distance traveled in the world. Port from Globox's RpgDifficulty.
'''
logoBlur = false

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="cloth_config"
type="required"
versionRange="[15.0,)"
ordering="AFTER"
side="BOTH"